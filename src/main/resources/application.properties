spring.application.name=ayvalik-bank-la

# 8081, not Spring Boot's default 8080, so this app and its hexagonal sibling
# (AyvalikBankHA-JAVA, which keeps 8080) can run at the same time.
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5438/ayvalikbank_la_java
spring.datasource.username=${DB_USERNAME:bankuser}
spring.datasource.password=${DB_PASSWORD:bankpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
